<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kick Clip Creator Companion</title>
    <style>
      body { background: #0b0d0e; color: #fff; font: 13px/1.4 Arial, sans-serif; margin: 0; min-width: 280px; padding: 16px; }
      h1 { color: #53fc18; font-size: 16px; margin: 0 0 8px; }
      p { margin: 8px 0 0; }
      #status { border: 1px solid #596065; border-radius: 6px; font-weight: 700; padding: 8px; }
      #status.connected { border-color: #53fc18; color: #53fc18; }
      #status.waiting { border-color: #f7c948; color: #f7c948; }
      code { color: #53fc18; }
    </style>
  </head>
  <body>
    <h1>Kick Clip Creator</h1>
    <div id="status" class="waiting">Checking Stream Deck...</div>
    <p>Stay signed in to Kick in this browser. The Stream Deck key handles <code>/clip 30</code> and shares the result to chat.</p>
    <script src="popup.js"></script>
  </body>
</html>
